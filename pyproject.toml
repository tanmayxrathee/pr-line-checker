[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftcheck"
version = "0.1.0"
description = "Automated Documentation Drift Detection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DriftCheck Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "unidiff>=0.7",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "docutils>=0.20",
    "rank-bm25>=0.2",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "openai>=1.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
treesitter = [
    "tree-sitter-language-pack>=0.2",
]

[project.scripts]
driftcheck = "driftcheck.cli:app"



[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
lint.ignore = [
    "S101", # assert in tests
]
format.quote-style = "double"
format.indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "treesitter: marks tests that require tree-sitter-language-pack",
]

[tool.hatch.build.targets.wheel]
packages = ["driftcheck"]

[tool.hatch.envs.default]
dependencies = []